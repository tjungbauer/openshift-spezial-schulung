# Demo credentials – fine for a training, never for production
# (use Sealed Secrets or an external secret store there).
apiVersion: v1
kind: Secret
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
type: Opaque
stringData:
  POSTGRESQL_USER: shop
  POSTGRESQL_PASSWORD: shop-demo-password
  POSTGRESQL_DATABASE: shop

# Lab 7 – the admin token, and a start that takes 40 s (FAULT_STARTUP_DELAY_S)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
spec:
  template:
    spec:
      containers:
      - name: catalog
        env:
        - name: ADMIN_TOKEN
          value: lab-token
        - name: FAULT_STARTUP_DELAY_S
          value: "40"

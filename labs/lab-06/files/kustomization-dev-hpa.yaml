# Lab 6 task 6 – the shop's dev overlay plus:
#   hpa-catalog.yaml          an HPA for catalog (2-6 replicas)
#   patch-catalog-lab.yaml    the admin token (task 3)
#   a JSON patch              removes spec.replicas from catalog – the HPA decides, not Git
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
- hpa-catalog.yaml              # lab 6 task 6: the HPA owns the replica count

# building blocks – dev keeps SQLite, on a PVC
# (available: networkpolicies, monitoring, persistent-orders, postgres, backup;
#  persistent-orders and postgres are alternatives for the orders data,
#  backup needs postgres)
components:
- ../../components/networkpolicies
- ../../components/monitoring
- ../../components/persistent-orders

labels:
- includeTemplates: true
  pairs:
    app.kubernetes.io/version: 1.0.0

images:
- name: shop-cart
  newName: quay.io/tjungbau/shop-cart-dev
  newTag: shop-test-dev
- name: shop-catalog
  newName: quay.io/tjungbau/shop-catalog-dev
  newTag: shop-test-dev
- name: shop-orders
  newName: quay.io/tjungbau/shop-orders-dev
  newTag: shop-test-dev
- name: shop-web
  newName: quay.io/tjungbau/shop-web-dev
  newTag: shop-test-dev
- name: shop-review
  newName: quay.io/tjungbau/shop-review-dev
  newTag: shop-test-dev

patches:
- path: patch-catalog-lab.yaml
- target:
    kind: Deployment
    name: catalog
  patch: |-
    - op: remove
      path: /spec/replicas

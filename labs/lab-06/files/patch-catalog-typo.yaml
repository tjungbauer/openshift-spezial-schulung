# Lab 6 – the admin token, and a typo in the liveness path (/health/livez)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
spec:
  template:
    spec:
      containers:
      - name: catalog
        env:
        - name: ADMIN_TOKEN
          value: lab-token
        livenessProbe:
          httpGet:
            path: /health/livez

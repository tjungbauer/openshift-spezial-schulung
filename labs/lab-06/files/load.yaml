# Lab 6 – a load generator for catalog. A lab tool, not part of the shop: it does NOT go
# to Git – apply it with oc. Each replica runs 4 parallel curl loops.
# The shop's NetworkPolicies only let web reach catalog – the second object lets "load" in.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load
  labels:
    app.kubernetes.io/name: load
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: load
  template:
    metadata:
      labels:
        app.kubernetes.io/name: load
    spec:
      terminationGracePeriodSeconds: 1
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
      - name: load
        image: registry.redhat.io/ubi9/ubi:9.9
        command: ["bash", "-c"]
        args:
        - for i in 1 2 3 4; do (while true; do curl -s -o /dev/null -m 5 http://catalog:8080/products; done) & done; wait
        resources:
          requests: { cpu: 10m, memory: 32Mi }
          limits: { memory: 64Mi }
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: [ALL] }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-load-to-catalog
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: catalog
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: load
    ports:
    - protocol: TCP
      port: 8080

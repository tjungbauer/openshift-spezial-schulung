apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
namePrefix: prod-
labels:
- pairs:
    env: prod
  includeSelectors: true
replicas:
- name: website
  count: 2
patches:
- path: patch-resources.yaml
components:
- ../../components/pdb
# Task 5 adds the image pinned by digest – the digest of the Pod running in dev:
# images:
# - name: quay.io/nginx/nginx-unprivileged
#   digest: sha256:<digest>

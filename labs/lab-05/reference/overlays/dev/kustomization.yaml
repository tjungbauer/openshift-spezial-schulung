apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
- presync-job.yaml              # PreSync hook (task 4)
namePrefix: dev-
labels:
- pairs:
    env: dev
  includeSelectors: true        # dev and prod run side by side: their selectors must differ
configMapGenerator:
- name: page
  behavior: replace             # the dev page instead of the base page
  files:
  - index.html
patches:
- path: patch-route-wave.yaml   # sync wave 1 for the Route (task 4)

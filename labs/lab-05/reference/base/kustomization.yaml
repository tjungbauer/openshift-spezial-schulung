apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- deployment.yaml
- service.yaml
- route.yaml
configurations:
- kustomizeconfig.yaml
labels:
- pairs:
    app.kubernetes.io/part-of: website
  includeTemplates: true        # also on the Pods – the selectors stay untouched
configMapGenerator:
- name: page
  files:
  - index.html

# Lab 0 – reference: the Deployment after task 3
# generated with: oc create deployment hello --image=quay.io/nginx/nginx-unprivileged:1.29.1 \
#                   --port=8080 --dry-run=client -o yaml > deployment.yaml
# then the env, volume and securityContext parts were added by hand
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  labels: { app: hello }
spec:
  replicas: 1
  selector:
    matchLabels: { app: hello }
  template:
    metadata:
      labels: { app: hello }
    spec:
      securityContext:                    # added: PodSecurity "restricted" (optional)
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
      - name: nginx-unprivileged
        image: quay.io/nginx/nginx-unprivileged:1.29.1
        ports:
        - containerPort: 8080
        securityContext:                  # added: PodSecurity "restricted" (optional)
          allowPrivilegeEscalation: false
          capabilities: { drop: [ALL] }
        env:                              # added: a value from the Secret
        - name: API_KEY
          valueFrom:
            secretKeyRef: { name: hello-secret, key: API_KEY }
        volumeMounts:                     # added: the web page from the ConfigMap
        - { name: page, mountPath: /usr/share/nginx/html }
      volumes:
      - name: page
        configMap: { name: hello-page }

# Lab 0 – a Pod with curl and getent for testing from inside the cluster
apiVersion: v1
kind: Pod
metadata:
  name: toolbox
  labels: { app: toolbox }
spec:
  securityContext:                # PodSecurity "restricted"
    runAsNonRoot: true
    seccompProfile: { type: RuntimeDefault }
  containers:
  - name: toolbox
    image: registry.access.redhat.com/ubi9/ubi:9.9
    command: ["sleep", "infinity"]
    securityContext:
      allowPrivilegeEscalation: false
      capabilities: { drop: [ALL] }
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 64Mi }

# Bonus: your own page – copy to website/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "website.fullname" . }}-page
  labels:
    {{- include "website.labels" . | nindent 4 }}
data:
  index.html: |
    <html>
      <body>
        <h1>{{ .Values.message | default "Hello from Helm" }}</h1>
        <p>Served by release {{ .Release.Name }} in {{ .Release.Namespace }}</p>
      </body>
    </html>

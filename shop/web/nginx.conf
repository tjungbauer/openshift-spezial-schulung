# web – nginx for the ACME shop: serves the UI and proxies /api/<service>/ to
# the backends, so the browser only ever talks to one host.
#
# Runs as any UID (OpenShift restricted-v2): pid and temp files go to /tmp,
# logs to stdout/stderr. No keepalive to the backends on purpose: every
# request opens a new connection, so the Service spreads requests over all
# pods and the footer of the UI shows the load balancing.

worker_processes 2;   # "auto" would start one worker per node CPU – too many in a pod
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    sendfile      on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    # request id: keep the caller's X-Request-ID or create a new one
    map $http_x_request_id $req_id {
        ""      $request_id;
        default $http_x_request_id;
    }

    # session id for cart and orders: from the cookie, or a new one
    map $cookie_shop_session $session_id {
        ""      $request_id;
        default $cookie_shop_session;
    }
    map $cookie_shop_session $session_cookie {
        ""      "shop_session=$request_id; Path=/; HttpOnly; SameSite=Lax";
        default "";   # an empty header value is not sent
    }

    # no log line for probe requests
    map $uri $loggable {
        ~^/health/ 0;
        default    1;
    }

    log_format json escape=json
        '{"time":"$time_iso8601","level":"info","service":"web","pod":"$hostname",'
        '"message":"request","request_id":"$req_id","method":"$request_method",'
        '"path":"$uri","status":$status,"duration_s":$request_time,'
        '"upstream":"$upstream_addr"}';
    access_log /dev/stdout json if=$loggable;

    include /etc/nginx/shop-build/version.conf;  # $shop_version, $shop_revision – written at build time
    include /etc/nginx/shop/*.conf;              # the backend upstreams – mount a ConfigMap here to change them

    server {
        listen 8080;
        root   /usr/share/nginx/html;

        add_header X-Request-ID $req_id always;
        add_header Set-Cookie   $session_cookie;

        # Host stays the upstream name (catalog, cart, orders) – the Service Mesh routes by it
        proxy_set_header X-Request-ID    $req_id;
        proxy_set_header X-Session-ID    $session_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout    15s;
        proxy_next_upstream   off;

        location = /health/started { default_type application/json; return 200 '{"status":"started"}'; }
        location = /health/ready   { default_type application/json; return 200 '{"status":"ready"}'; }
        location = /health/live    { default_type application/json; return 200 '{"status":"alive"}'; }

        location = /info {
            default_type application/json;
            return 200 '{"app":"web","version":"$shop_version","revision":"$shop_revision","pod":"$hostname"}';
        }

        # admin and metrics endpoints of the backends are not for the internet
        location ~ ^/api/[^/]+/(admin|metrics) {
            return 404;
        }

        location /api/catalog/ { proxy_pass http://catalog/; }
        location /api/cart/    { proxy_pass http://cart/; }
        location /api/orders/  { proxy_pass http://orders/; }
        location /api/review/  { proxy_pass http://review/; }   # optional: the UI copes without it

        # backend not reachable: JSON for the status panel instead of an HTML error page
        error_page 502 504 = @unreachable;
        location @unreachable {
            default_type application/json;
            return 502 '{"detail":"backend unreachable"}';
        }

        location / {
            expires -1;  # always fetch the newest UI – a rolling update shows at once
            try_files $uri $uri/ /index.html;
        }
    }
}

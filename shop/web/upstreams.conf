# Where web finds the backends: the Kubernetes Services in the same namespace.
# nginx resolves these names once, at start – the Services must exist (they
# are part of the same kustomization).
#
# To point web somewhere else, mount a ConfigMap with an upstreams.conf at
# /etc/nginx/shop/ (the local pod in local/shop-pod.yaml does exactly that).

upstream catalog { server catalog:8080; }
upstream cart    { server cart:8080; }
upstream orders  { server orders:8080; }
upstream review  { server review:8080; }

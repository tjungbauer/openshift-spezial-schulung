# the only way into the shop from outside: HTTPS, TLS ends at the router
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
spec:
  to:
    kind: Service
    name: web
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

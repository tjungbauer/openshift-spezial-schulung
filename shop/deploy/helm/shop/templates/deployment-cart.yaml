# cart – one shopping cart per session, in memory
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart
  labels:
    app.kubernetes.io/name: cart
    {{- include "shop.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.cart.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: cart
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cart
        {{- include "shop.labels" . | nindent 8 }}
    spec:
      {{- include "shop.podSecurity" . | nindent 6 }}
      containers:
      - name: cart
        image: {{ include "shop.image" (list . "cart") }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 8080
        resources:
          {{- toYaml .Values.cart.resources | nindent 10 }}
        {{- include "shop.containerSecurity" . | nindent 8 }}
        {{- include "shop.probes" . | nindent 8 }}

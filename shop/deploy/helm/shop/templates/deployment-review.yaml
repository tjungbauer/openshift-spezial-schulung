{{- if .Values.review.enabled }}
# review – star ratings per product (optional for the shop)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: review
  labels:
    app.kubernetes.io/name: review
    {{- include "shop.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.review.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: review
  template:
    metadata:
      labels:
        app.kubernetes.io/name: review
        {{- include "shop.labels" . | nindent 8 }}
    spec:
      {{- include "shop.podSecurity" . | nindent 6 }}
      containers:
      - name: review
        image: {{ include "shop.image" (list . "review") }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 8080
        resources:
          {{- toYaml .Values.review.resources | nindent 10 }}
        {{- include "shop.containerSecurity" . | nindent 8 }}
        {{- include "shop.probes" . | nindent 8 }}
{{- end }}

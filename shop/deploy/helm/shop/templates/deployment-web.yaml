# web – the shop UI (nginx), proxies /api/ to the backends by their Service names
{{- include "shop.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
    {{- include "shop.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        {{- include "shop.labels" . | nindent 8 }}
    spec:
      {{- include "shop.podSecurity" . | nindent 6 }}
      containers:
      - name: web
        image: {{ include "shop.image" (list . "web") }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 8080
        resources:
          {{- toYaml .Values.web.resources | nindent 10 }}
        {{- include "shop.containerSecurity" . | nindent 8 }}
        {{- include "shop.probes" . | nindent 8 }}

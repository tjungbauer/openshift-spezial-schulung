# one Service per component – web reaches the backends by these names
{{- $components := list "web" "catalog" "cart" "orders" }}
{{- if .Values.review.enabled }}{{ $components = append $components "review" }}{{ end }}
{{- range $components }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ . }}
  labels:
    app.kubernetes.io/name: {{ . }}
    {{- include "shop.labels" $ | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ . }}
  ports:
  - name: http
    port: 8080
    targetPort: http
{{- end }}

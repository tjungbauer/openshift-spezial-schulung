# Default values of the ACME shop chart.
# Images: <image.registry>/shop-<component><image.suffix>:<image.tag>
# Resource names are fixed (web, catalog, cart, orders, review, postgres): web's nginx
# finds the backends by these Service names – one shop per namespace.

image:
  registry: quay.io/tjungbau
  suffix: ""              # "-dev" for the dev images
  tag: shop-test
  pullPolicy: Always      # tags like shop-test are reused – always fetch the newest image

logLevel: info            # LOG_LEVEL of catalog and orders (ConfigMaps)

web:
  replicas: 1
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { memory: 64Mi }
  route:
    enabled: true
    host: ""              # empty: OpenShift generates the host name

catalog:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { memory: 256Mi }

cart:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { memory: 256Mi }

orders:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { memory: 256Mi }
  persistence:            # SQLite on a PVC instead of an emptyDir – alternative to postgresql
    enabled: false
    size: 1Gi
    storageClassName: ""  # empty: the default StorageClass

review:
  enabled: true           # optional – the UI copes without it
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { memory: 256Mi }

postgresql:               # orders on PostgreSQL – alternative to orders.persistence
  enabled: false
  image: registry.redhat.io/rhel9/postgresql-16:9.9-1793851884
  auth:                   # demo credentials – never for production
    user: shop
    password: shop-demo-password
    database: shop
  storage:
    size: 1Gi
    storageClassName: ""

backup:                   # pg_dump CronJob + backup-viewer – needs postgresql.enabled
  enabled: false
  schedule: "*/5 * * * *"
  keep: 12                # number of dumps to keep
  size: 2Gi
  storageClassName: ""
  viewerImage: registry.access.redhat.com/hi/python:3.12.16-builder

networkPolicies:
  enabled: true           # default deny + exactly the paths the shop needs

monitoring:
  enabled: true           # ServiceMonitors – only rendered if the cluster has the CRD

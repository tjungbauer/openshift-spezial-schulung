# headless Service: gives the StatefulSet pod a stable DNS name (postgres-0.postgres)
# and "postgres" resolves directly to the pod IP
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
  - name: postgresql
    port: 5432
    targetPort: postgresql

# PostgreSQL 16 from Red Hat – configured only through its documented env vars
# (POSTGRESQL_USER, POSTGRESQL_PASSWORD, POSTGRESQL_DATABASE). Runs as any UID.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: postgres
        image: registry.redhat.io/rhel9/postgresql-16:9.9-1793851884
        ports:
        - name: postgresql
          containerPort: 5432
        envFrom:
        - secretRef:
            name: postgres
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        startupProbe:
          exec:
            command: [/usr/libexec/check-container]
          periodSeconds: 5
          failureThreshold: 24
        readinessProbe:
          exec:
            command: [/usr/libexec/check-container]
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          exec:
            command: [/usr/libexec/check-container, --live]
          periodSeconds: 20
          timeoutSeconds: 5
        volumeMounts:
        - name: data
          mountPath: /var/lib/pgsql/data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi

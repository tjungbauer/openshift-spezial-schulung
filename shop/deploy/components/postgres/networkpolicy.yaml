# orders and the migration Job may reach PostgreSQL (matters once the
# networkpolicies component closes the namespace – harmless without it)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-orders-to-postgres
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - key: app.kubernetes.io/name
          operator: In
          values: [orders, orders-migrate]
    ports:
    - protocol: TCP
      port: 5432

# scrape /metrics of every backend Service every 30 s
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: catalog
  labels:
    app.kubernetes.io/name: catalog
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog
  endpoints:
  - port: http
    path: /metrics
    interval: 30s

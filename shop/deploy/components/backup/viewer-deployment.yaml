# Shows the dumps from the terminal – the same PVC, mounted read-only, in a second pod:
#   oc rsh deploy/backup-viewer ls -l /backups
#   oc port-forward deploy/backup-viewer 8080:8080   ->  http://localhost:8080 (file list)
# No own image: python -m http.server in the hardened Python image of the shop –
# the -builder variant, because it has a shell: oc rsh deploy/backup-viewer, then
# ls -l /backups, du -sh /backups ... (the runtime variant is distroless).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backup-viewer
  labels:
    app.kubernetes.io/name: backup-viewer
spec:
  replicas: 1
  strategy:
    type: Recreate      # ReadWriteOnce volume: the old pod must let go before the new one starts
  selector:
    matchLabels:
      app.kubernetes.io/name: backup-viewer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backup-viewer
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: viewer
        image: registry.access.redhat.com/hi/python:3.12.16-builder
        command: [python3.12, -m, http.server, "8080", --directory, /backups]
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        readinessProbe:
          httpGet: { path: /, port: http }
          periodSeconds: 10
        livenessProbe:
          tcpSocket: { port: http }
          periodSeconds: 20
        volumeMounts:
        - name: backups
          mountPath: /backups
          readOnly: true
      volumes:
      - name: backups
        persistentVolumeClaim:
          claimName: backups

# Lab 8 task 4 – two alerts for catalog. Goes to Git: copy it into
# $SHOP_WORK/overlays/dev/ – Argo CD creates it in your shop namespace.
# job="catalog" is the Service the ServiceMonitor scrapes; the namespace is added
# automatically (user workload monitoring only sees the rule's own namespace).
# Probes and scrapes are left out – they are counted too, and they never fail.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: catalog
spec:
  groups:
  - name: catalog
    rules:
    - alert: CatalogErrorRateHigh
      expr: |
        sum(rate(shop_http_requests_total{job="catalog",status=~"5..",endpoint!~"/health/.*|/metrics"}[1m]))
          /
        sum(rate(shop_http_requests_total{job="catalog",endpoint!~"/health/.*|/metrics"}[1m]))
          > 0.05
      for: 1m
      labels:
        severity: warning
      annotations:
        summary: More than 5 % of the catalog calls fail
        description: '{{ $value | humanizePercentage }} of the catalog API calls answered with 5xx in the last minute.'
    - alert: CatalogSlow
      expr: |
        histogram_quantile(0.95,
          sum by (le) (rate(shop_http_request_duration_seconds_bucket{job="catalog",endpoint!~"/health/.*|/metrics"}[2m]))
        ) > 0.5
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: catalog p95 latency above 500 ms
        description: p95 latency of the catalog API is {{ $value | humanizeDuration }}.

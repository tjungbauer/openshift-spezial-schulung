# Demo 19 – plays the users: GET /products five times per second, one line per call:
#   <time> <HTTP status>      000 = no answer (connection refused or timeout)
apiVersion: v1
kind: Pod
metadata:
  name: probe
  labels:
    app.kubernetes.io/name: probe
spec:
  terminationGracePeriodSeconds: 1
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: probe
    image: registry.redhat.io/ubi9/ubi:9.9
    command: ["bash", "-c"]
    args:
    - while true; do echo "$(date +%T) $(curl -s -o /dev/null -m 2 -w '%{http_code}' http://catalog:8080/products)"; sleep 0.2; done
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL

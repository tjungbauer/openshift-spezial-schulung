# Demo 19 – catalog from the shop's deploy/base (one replica, as in Git) and a probe Pod
# that calls it five times per second. oc apply -k . (the script does that)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../shop/deploy/base/catalog
- probe.yaml

labels:
- pairs:
    app.kubernetes.io/part-of: demo-19
  includeSelectors: false
  includeTemplates: true

images:
- name: shop-catalog
  newName: quay.io/tjungbau/shop-catalog-dev
  newTag: shop-test-dev

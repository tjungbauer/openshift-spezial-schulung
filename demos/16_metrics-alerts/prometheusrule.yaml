# Demo 16 – two alerts for catalog, evaluated by the user-workload Prometheus / Thanos Ruler
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: catalog
  labels:
    app.kubernetes.io/part-of: demo-16
spec:
  groups:
  - name: catalog
    rules:
    - alert: CatalogErrorRateHigh
      # 5xx share of the API calls (health checks and /metrics left out)
      expr: |
        sum(rate(shop_http_requests_total{job="catalog",status=~"5..",endpoint!~"/health/.*|/metrics"}[1m]))
          /
        sum(rate(shop_http_requests_total{job="catalog",endpoint!~"/health/.*|/metrics"}[1m]))
          > 0.05
      for: 1m
      labels:
        severity: warning
      annotations:
        summary: More than 5 % of the catalog calls fail
        description: '{{ $value | humanizePercentage }} of the catalog API calls answered with 5xx in the last minute.'
    - alert: CatalogSlow
      # 95 % of the API calls faster than 500 ms?
      expr: |
        histogram_quantile(0.95,
          sum by (le) (rate(shop_http_request_duration_seconds_bucket{job="catalog",endpoint!~"/health/.*|/metrics"}[2m]))
        ) > 0.5
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: catalog p95 latency above 500 ms
        description: 'p95 latency of the catalog API is {{ $value | humanizeDuration }}.'

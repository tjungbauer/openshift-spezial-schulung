# Demo 16 – the shop's catalog service on its own, with an admin token so the
# demo can switch faults on (POST /admin/fault). The Service carries the label
# the ServiceMonitor selects.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  labels:
    app.kubernetes.io/name: catalog
    app.kubernetes.io/part-of: demo-16
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog
        app.kubernetes.io/part-of: demo-16
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
      - name: catalog
        image: quay.io/tjungbau/shop-catalog-dev:shop-test-dev
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: ADMIN_TOKEN       # enables POST /admin/fault (demo only)
          value: demo-token
        resources:
          requests: { cpu: 50m, memory: 96Mi }
          limits: { memory: 256Mi }
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: [ALL] }
        readinessProbe:
          httpGet: { path: /health/ready, port: http }
          periodSeconds: 5
        livenessProbe:
          httpGet: { path: /health/live, port: http }
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  labels:
    app.kubernetes.io/name: catalog       # <- the ServiceMonitor selects this label
    app.kubernetes.io/part-of: demo-16
spec:
  selector:
    app.kubernetes.io/name: catalog
  ports:
  - name: http                            # <- and this port name
    port: 8080
    targetPort: http

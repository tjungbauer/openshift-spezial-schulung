# Demo 13 – a Pod that mounts the PVC "data" at /data
apiVersion: v1
kind: Pod
metadata:
  name: writer
  labels:
    app.kubernetes.io/name: writer
    app.kubernetes.io/part-of: demo-13
spec:
  terminationGracePeriodSeconds: 1
  securityContext:
    runAsNonRoot: true
    seccompProfile: { type: RuntimeDefault }
  containers:
  - name: shell
    image: registry.access.redhat.com/ubi9/ubi:9.9
    command: ["sleep", "infinity"]
    volumeMounts:
    - { name: data, mountPath: /data }
    resources:
      requests: { cpu: 10m, memory: 16Mi }
      limits: { memory: 32Mi }
    securityContext:
      allowPrivilegeEscalation: false
      capabilities: { drop: [ALL] }
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: data

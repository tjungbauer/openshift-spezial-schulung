# Demo 13 – a Deployment with an RWO volume and the default strategy RollingUpdate:
# fine on one node, stuck as soon as the new Pod lands on another node (Multi-Attach).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app-data
  labels:
    app.kubernetes.io/part-of: demo-13
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app.kubernetes.io/name: app
    app.kubernetes.io/part-of: demo-13
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: app
        app.kubernetes.io/part-of: demo-13
    spec:
      terminationGracePeriodSeconds: 1
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
      - name: shell
        image: registry.access.redhat.com/ubi9/ubi:9.9
        command: ["sleep", "infinity"]
        volumeMounts:
        - { name: data, mountPath: /data }
        resources:
          requests: { cpu: 10m, memory: 16Mi }
          limits: { memory: 32Mi }
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: [ALL] }
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: app-data

# Demo 13 – a snapshot of the PVC "data". The VolumeSnapshotClass of the training cluster is
# csi-aws-vsc (oc get volumesnapshotclass) – change it for another cluster.
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshot
metadata:
  name: data-snap
  labels:
    app.kubernetes.io/part-of: demo-13
spec:
  volumeSnapshotClassName: csi-aws-vsc
  source:
    persistentVolumeClaimName: data

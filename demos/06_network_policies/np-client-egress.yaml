# step 5: the client may only resolve names and call the web app
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: client-egress
  labels: { openshift-example: "yes" }
spec:
  podSelector:
    matchLabels: { app: client }
  policyTypes: [Egress]
  egress:
  - to:                                   # cluster DNS
    - namespaceSelector:
        matchLabels: { kubernetes.io/metadata.name: openshift-dns }
    ports:                                # 53 = Service port, 5353 = DNS Pod port
    - { protocol: UDP, port: 53 }
    - { protocol: TCP, port: 53 }
    - { protocol: UDP, port: 5353 }
    - { protocol: TCP, port: 5353 }
  - to:                                   # the web app in this namespace
    - podSelector:
        matchLabels: { app: web }
    ports:
    - { protocol: TCP, port: 8080 }

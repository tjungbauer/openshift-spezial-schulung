# optional step 6 – needs cluster-admin: what may leave the cluster from this namespace
apiVersion: k8s.ovn.org/v1
kind: EgressFirewall
metadata:
  name: default                 # must be "default", one per namespace
spec:
  egress:
  - type: Allow
    to: { dnsName: access.redhat.com }
  - type: Deny
    to: { cidrSelector: 0.0.0.0/0 }

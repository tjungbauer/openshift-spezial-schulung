# Demo 22 – a PVC without storageClassName: the default class (gp3-csi on the training
# cluster) – ReadWriteOnce, 1 GiB. Stays Pending until a Pod uses it (WaitForFirstConsumer).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  labels:
    app.kubernetes.io/part-of: demo-22
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi

# Demo 13 – the same app, 40 s to start (FAULT_STARTUP_DELAY_S), twice:
#   slow-with-startup  a startup probe holds readiness and liveness back
#   slow-no-startup    no startup probe, liveness asks /health/ready -> killed while starting
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slow-with-startup
  labels:
    app.kubernetes.io/name: slow-with-startup
    app.kubernetes.io/part-of: demo-13
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: slow-with-startup
  template:
    metadata:
      labels:
        app.kubernetes.io/name: slow-with-startup
        app.kubernetes.io/part-of: demo-13
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
      - name: catalog
        image: quay.io/tjungbau/shop-catalog-dev:shop-test-dev
        env:
        - name: FAULT_STARTUP_DELAY_S
          value: "40"
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests: { cpu: 50m, memory: 96Mi }
          limits: { memory: 256Mi }
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: [ALL] }
        startupProbe:             # 30 x 2 s = 60 s budget for the start
          httpGet: { path: /health/started, port: http }
          periodSeconds: 2
          failureThreshold: 30
        readinessProbe:
          httpGet: { path: /health/ready, port: http }
          periodSeconds: 5
        livenessProbe:
          httpGet: { path: /health/live, port: http }
          periodSeconds: 10
          failureThreshold: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slow-no-startup
  labels:
    app.kubernetes.io/name: slow-no-startup
    app.kubernetes.io/part-of: demo-13
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: slow-no-startup
  template:
    metadata:
      labels:
        app.kubernetes.io/name: slow-no-startup
        app.kubernetes.io/part-of: demo-13
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
      - name: catalog
        image: quay.io/tjungbau/shop-catalog-dev:shop-test-dev
        env:
        - name: FAULT_STARTUP_DELAY_S
          value: "40"
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests: { cpu: 50m, memory: 96Mi }
          limits: { memory: 256Mi }
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: [ALL] }
        readinessProbe:
          httpGet: { path: /health/ready, port: http }
          periodSeconds: 5
        livenessProbe:            # the mistake: liveness asks "ready?" – and no startup probe
          httpGet: { path: /health/ready, port: http }
          periodSeconds: 5
          failureThreshold: 3     # 3 x 5 s = killed after ~15 s, long before the 40 s start

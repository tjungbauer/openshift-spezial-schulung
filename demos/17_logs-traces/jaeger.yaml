# Demo 17 – Jaeger all-in-one as a stand-in for the platform's tracing stack
# (Tempo + OpenTelemetry collector + Observe › Traces). For the demo only: in-memory
# storage, one replica, no authentication on the UI – everything is gone when the Pod goes.
#   4318   OTLP over HTTP – the shop sends its spans here (OTEL_EXPORTER_OTLP_ENDPOINT)
#   16686  the Jaeger UI – exposed with a Route
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/part-of: demo-17
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaeger
        app.kubernetes.io/part-of: demo-17
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: jaeger
        image: quay.io/jaegertracing/jaeger:2.10.0
        ports:
        - name: otlp-http
          containerPort: 4318
        - name: ui
          containerPort: 16686
        readinessProbe:
          httpGet:
            path: /
            port: ui
          periodSeconds: 5
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/part-of: demo-17
spec:
  selector:
    app.kubernetes.io/name: jaeger
  ports:
  - name: otlp-http
    port: 4318
    targetPort: otlp-http
  - name: ui
    port: 16686
    targetPort: ui
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: jaeger
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/part-of: demo-17
spec:
  to:
    kind: Service
    name: jaeger
  port:
    targetPort: ui
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

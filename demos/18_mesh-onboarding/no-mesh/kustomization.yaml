# Demo 18 – the real shop, as in the dev overlay: web, catalog, cart, orders, review with
# NetworkPolicies (default deny), ServiceMonitors and the orders PVC – plus "shopper",
# a Pod that uses every service of the shop through web.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../../shop/deploy/overlays/dev
- shopper.yaml

labels:
- pairs:
    app.kubernetes.io/part-of: demo-18
  includeSelectors: false
  includeTemplates: true

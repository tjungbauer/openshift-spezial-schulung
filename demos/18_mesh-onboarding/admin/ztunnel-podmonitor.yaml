# Demo 18 – cluster-admin, once per cluster: Prometheus scrapes ztunnel – the L4 (TCP)
# metrics of all ambient Pods (istio_tcp_*). Without it, Kiali shows no edges for
# ambient workloads without a waypoint. Check the label first:
#   oc -n ztunnel get pods --show-labels
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: ztunnel
  namespace: ztunnel
spec:
  selector:
    matchLabels:
      app: ztunnel
  podMetricsEndpoints:
  - targetPort: 15020
    path: /stats/prometheus
    interval: 30s

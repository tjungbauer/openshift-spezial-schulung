# Demo 18 – ambient traffic and the shop's default deny.
# Between ambient Pods (and through the waypoint) the calls arrive as HBONE on port 15008,
# not on 8080 – the shop's NetworkPolicies only open 8080, so the mesh needs this rule.
# Health probes of ambient Pods come from 169.254.7.127 (SNAT by istio-cni).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ambient
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector: {}               # ambient Pods and the waypoint of this namespace
    ports:
    - { protocol: TCP, port: 15008 }
  - from:
    - ipBlock: { cidr: 169.254.7.127/32 }

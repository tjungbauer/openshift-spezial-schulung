# Demo 18 – the shop in the mesh (ambient mode): the same shop (../no-mesh) plus what the
# application team adds – the ambient label in every Pod template, and a NetworkPolicy
# for the mesh traffic (HBONE). No sidecar: the Pods stay 1/1, ztunnel on each node
# carries their traffic (mTLS, L4).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../no-mesh
- allow-ambient.yaml

patches:
- target:
    kind: Deployment
  patch: |-
    - op: add
      path: /spec/template/metadata/labels/istio.io~1dataplane-mode
      value: ambient

# Demo 18 – a waypoint proxy for the namespace: an Envoy Deployment that handles L7
# (HTTP metrics, routing, retries, L7 policies) for the Services that use it.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: waypoint
  labels:
    istio.io/waypoint-for: service
spec:
  gatewayClassName: istio-waypoint
  listeners:
  - name: mesh
    port: 15008
    protocol: HBONE

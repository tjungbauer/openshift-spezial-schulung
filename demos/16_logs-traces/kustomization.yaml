# Demo 16 – the shop from the repository (deploy/base), without NetworkPolicies and
# monitoring – only what the demo needs. oc apply -k . (the script does that)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../shop/deploy/base
- client.yaml

labels:
- pairs:
    app.kubernetes.io/part-of: demo-16
  includeSelectors: false
  includeTemplates: true

images:
- name: shop-cart
  newName: quay.io/tjungbau/shop-cart-dev
  newTag: shop-test-dev
- name: shop-catalog
  newName: quay.io/tjungbau/shop-catalog-dev
  newTag: shop-test-dev
- name: shop-orders
  newName: quay.io/tjungbau/shop-orders-dev
  newTag: shop-test-dev
- name: shop-web
  newName: quay.io/tjungbau/shop-web-dev
  newTag: shop-test-dev
- name: shop-review
  newName: quay.io/tjungbau/shop-review-dev
  newTag: shop-test-dev

patches:
- path: patch-catalog.yaml

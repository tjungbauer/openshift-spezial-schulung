apiVersion: v1
kind: Pod
metadata:
  labels:
    run: simple-pod
    openshift-example: "yes"
  name: simple-pod
spec:
  securityContext:                 # pod level: applies to all containers
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
  - image: registry.redhat.io/ubi9/ubi:9.9
    name: simple-pod
    command:
      - sh
      - -c
      - 'echo "hello world" && sleep infinity'
    securityContext:               # container level
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL

# Demo 20 – catalog made highly available (oc patch --patch-file, strategic merge):
#   3 replicas, at most one more Pod per zone / per node than elsewhere,
#   rolling update without a missing replica, and 5 s for the router/Service to notice.
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway       # prefer – a zone may be full
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: catalog
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule        # never two more on one node
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: catalog
      containers:
      - name: catalog
        lifecycle:
          preStop:
            sleep:
              seconds: 5                        # stay up while the endpoints are updated

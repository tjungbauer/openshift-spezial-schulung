# Demo 19 – canary: 90 % of the calls to v1, 10 % to v2
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: catalog
spec:
  hosts: [catalog]
  http:
  - route:
    - destination: { host: catalog, subset: v1 }
      weight: 90
    - destination: { host: catalog, subset: v2 }
      weight: 10

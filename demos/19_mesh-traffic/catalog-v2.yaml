# Demo 19 – catalog version 2: the same image as v1 (a stand-in for a new release),
# labels version: v2 and the ambient label. The Service catalog selects it as well.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-v2
  labels:
    app.kubernetes.io/name: catalog
    app.kubernetes.io/part-of: demo-18
    version: v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog
      version: v2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog
        app.kubernetes.io/part-of: demo-18
        version: v2
        istio.io/dataplane-mode: ambient
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
      - name: catalog
        image: quay.io/tjungbau/shop-catalog-dev:shop-test-dev
        imagePullPolicy: Always
        ports:
        - { name: http, containerPort: 8080 }
        envFrom:
        - configMapRef: { name: catalog }
        resources:
          requests: { cpu: 50m, memory: 96Mi }
          limits: { memory: 256Mi }
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: [ALL] }
        readinessProbe:
          httpGet: { path: /health/ready, port: http }
          periodSeconds: 5
---
# one Service per version – only needed for the Gateway API variant (rules/canary-httproute.yaml)
apiVersion: v1
kind: Service
metadata:
  name: catalog-v1
  labels: { app.kubernetes.io/part-of: demo-18 }
spec:
  selector: { app.kubernetes.io/name: catalog, version: v1 }
  ports:
  - { name: http, port: 8080, targetPort: http }
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-v2
  labels: { app.kubernetes.io/part-of: demo-18 }
spec:
  selector: { app.kubernetes.io/name: catalog, version: v2 }
  ports:
  - { name: http, port: 8080, targetPort: http }

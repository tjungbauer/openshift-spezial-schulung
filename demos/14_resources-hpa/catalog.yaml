# Demo 14 – two copies of the shop's catalog service, same requests, one difference:
#   catalog          no CPU limit  – may use idle CPU on the node (the HPA target)
#   catalog-limited  CPU limit 50m – throttled by the kernel when it wants more
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  labels:
    app.kubernetes.io/name: catalog
    app.kubernetes.io/part-of: demo-14
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog
        app.kubernetes.io/part-of: demo-14
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
      - name: catalog
        image: quay.io/tjungbau/shop-catalog-dev:shop-test-dev
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests: { cpu: 50m, memory: 96Mi }   # what the scheduler reserves – and the HPA's 100 %
          limits: { memory: 256Mi }              # no CPU limit
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: [ALL] }
        readinessProbe:
          httpGet: { path: /health/ready, port: http }
          periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-limited
  labels:
    app.kubernetes.io/name: catalog-limited
    app.kubernetes.io/part-of: demo-14
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog-limited
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog-limited
        app.kubernetes.io/part-of: demo-14
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
      - name: catalog
        image: quay.io/tjungbau/shop-catalog-dev:shop-test-dev
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests: { cpu: 50m, memory: 96Mi }
          limits: { cpu: 50m, memory: 256Mi }    # CPU limit = request: 5 ms CPU per 100 ms period
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: [ALL] }
        readinessProbe:
          httpGet: { path: /health/ready, port: http }
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  labels:
    app.kubernetes.io/part-of: demo-14
spec:
  selector:
    app.kubernetes.io/name: catalog
  ports:
  - name: http
    port: 8080
    targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-limited
  labels:
    app.kubernetes.io/part-of: demo-14
spec:
  selector:
    app.kubernetes.io/name: catalog-limited
  ports:
  - name: http
    port: 8080
    targetPort: http

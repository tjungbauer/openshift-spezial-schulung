apiVersion: v1
data:
  run.sh: "#!/bin/sh\n\nset -euf pipefail\n\nIFS='\n'\n\nPATH=/usr/bin:/usr/local/bin\n\nENV_VAR_VALUE=${VARIABLE:-}\nENV_SECRET_VALUE=${SECRET:-}\n\nCONFIG=/etc/test/config.yml\n\nwhile
    /bin/true; do\n    echo \"Reading content of $CONFIG\"\n    if [ -f \"$CONFIG\"
    ]; then\n\tcat \"$CONFIG\"\n    else\n\techo 'WARNING: /etc/test/config.yml does
    not exist'\n    fi\n\n    echo \"VARIABLE: $ENV_VAR_VALUE\"\n    echo \"SECRET:
    $ENV_SECRET_VALUE\"\n    sleep 1\ndone\n"
kind: ConfigMap
metadata:
  name: run
